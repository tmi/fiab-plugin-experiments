[build-system]
build-backend = "uv_build"
requires = [ "uv_build>=0.11,<0.12" ]

[project]
name = "fiab-plugin-experiments-runtime"
version = "0.1.0"
description = "Weather Forecast in a Box, experiments plugin (runtime callables)"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [
  { name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int" },
]
requires-python = ">=3.11"
# NOTE deliberately no dependency on fiab-core nor fiab-plugin-experiments
dependencies = [
  "earthkit-data>=0.18.2,<1",
  "numpy",
]

[dependency-groups]
dev = [ "pytest", "ruff", "ty" ]

[tool.ruff]
line-length = 140
lint.select = [ "E", "F", "I", "ANN" ]
lint.ignore = [ "ANN401" ]
